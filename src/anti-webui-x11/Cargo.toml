[package]
name = "anti-webui-x11"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Linux only: elsewhere the crate is empty, so that the workspace builds on every OS.
[target.'cfg(target_os = "linux")'.dependencies]
anti-webui-core.workspace = true
x11rb = { version = "0.14", features = [
    "allow-unsafe-code",
    "cursor",
    "resource_manager",
    "dri3",
    "present",
    "randr",
    "shape",
    "sync",
    "xfixes",
    "xinput",
    "xkb",
] }
xkbcommon = { workspace = true, features = ["x11"] }
xim = { version = "0.6", default-features = false, features = ["client", "x11rb-client", "x11rb-xcb"] }
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["fs"] }
log.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["allow-unsafe-code", "xtest"] }
