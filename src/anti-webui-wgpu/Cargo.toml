[package]
name = "anti-webui-wgpu"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
kurbo.workspace = true
log.workspace = true
anti-webui-core.workspace = true
wgpu.workspace = true
naga.workspace = true
swash.workspace = true
bytemuck.workspace = true
raw-window-handle.workspace = true
pollster.workspace = true

# Our own DXGI swapchain (see `src/dxgi.rs`).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ash.workspace = true
libc.workspace = true
libloading.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-metal = { workspace = true, features = [
    "std",
    "objc2-io-surface",
    "MTLAllocation",
    "MTLCommandBuffer",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLResource",
    "MTLTexture",
] }
objc2-io-surface = { workspace = true, features = ["std", "objc2", "objc2-core-foundation", "IOSurfaceRef", "IOSurfaceTypes"] }
objc2-core-foundation = { workspace = true, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
