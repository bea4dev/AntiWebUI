[package]
name = "anti-webui-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["wayland", "x11", "macos"]
## Plays videos with an FFmpeg found at run time.
video = ["dep:anti-webui-video"]
## Runs on Wayland compositors.
wayland = ["dep:anti-webui-wayland"]
## Runs on X servers. See `docs/design/35-platform-x11.md`.
x11 = ["dep:anti-webui-x11"]
## Runs on macOS. See `docs/design/38-platform-macos.md`.
macos = ["dep:anti-webui-macos"]

[dependencies]
anti-webui-core.workspace = true
anti-webui-wgpu.workspace = true
log.workspace = true
anti-webui-video = { workspace = true, optional = true }
png.workspace = true

[dev-dependencies]
anti-webui-core = { workspace = true, features = ["svg", "svg-text"] }
anti-webui-video.workspace = true
anti-webui-pdf.workspace = true
image.workspace = true
moxcms.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anti-webui-wayland = { workspace = true, optional = true }
anti-webui-x11 = { workspace = true, optional = true }
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
anti-webui-macos.workspace = true
objc2-app-kit = { workspace = true, features = ["NSEvent"] }

[[test]]
name = "macos"
harness = false

[[test]]
name = "macos_spawn"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
anti-webui-macos = { workspace = true, optional = true }
raw-window-handle.workspace = true
libc.workspace = true
