[package]
name = "anti-webui-pdf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A fast PDF viewer for AntiWebUI, on hayro"

[dependencies]
kurbo.workspace = true
libc.workspace = true
read-fonts.workspace = true
anti-webui-core.workspace = true
hayro.workspace = true
fontique.workspace = true
log.workspace = true
subsetter = { workspace = true }
rquickjs = { workspace = true, optional = true }

[features]
## The JavaScript of documents, on QuickJS. See "JavaScript" in `docs/design/26-pdf.md`.
js = ["dep:rquickjs"]

[dev-dependencies]
anti-webui-core = { workspace = true, features = ["svg"] }
