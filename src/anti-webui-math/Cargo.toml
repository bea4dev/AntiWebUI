[package]
name = "anti-webui-math"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "LaTeX formulas for AntiWebUI, laid out as KaTeX does, without JavaScript"

[dependencies]
anti-webui-core.workspace = true
kurbo.workspace = true
log.workspace = true
read-fonts.workspace = true
# Pinned: it is young, and its API changes between releases. Only the parser and the layout: what
# draws, and what looks for system fonts, is AntiWebUI's.
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-font = "=0.1.15"

[dev-dependencies]
anti-webui-app = { workspace = true, features = ["wayland", "x11", "macos", "windows"] }
