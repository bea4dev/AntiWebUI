[package]
name = "anti-webui-wayland"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# Linux only: elsewhere the crate is empty, so that the workspace builds on every OS.
[target.'cfg(target_os = "linux")'.dependencies]
anti-webui-core.workspace = true
wayland-client.workspace = true
wayland-backend.workspace = true
wayland-protocols.workspace = true
xkbcommon.workspace = true
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { workspace = true, features = ["server"] }
