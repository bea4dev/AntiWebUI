# !tyml @cargo/Cargo
[workspace]
resolver = "2"
members = [
    "src/anti-webui",
    "src/anti-webui-internal",
    "src/anti-webui-dylib",
    "src/anti-webui-core",
    "src/anti-webui-style",
    "src/anti-webui-macros",
    "src/anti-webui-widgets",
    "src/anti-webui-md3e",
    "src/anti-webui-symbols-outlined",
    "src/anti-webui-app",
    "src/anti-webui-wgpu",
    "src/anti-webui-video",
    "src/anti-webui-pdf",
    "src/anti-webui-markdown",
    "src/anti-webui-code",
    "src/anti-webui-wayland",
    "src/anti-webui-x11",
    "src/anti-webui-windows",
    "src/anti-webui-macos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["bea4dev"]
repository = "https://github.com/bea4dev/AntiWebUI"

[workspace.dependencies]
anti-webui = { path = "src/anti-webui", version = "0.1.0" }
anti-webui-internal = { path = "src/anti-webui-internal", version = "0.1.0", default-features = false }
anti-webui-dylib = { path = "src/anti-webui-dylib", version = "0.1.0" }
anti-webui-core = { path = "src/anti-webui-core", version = "0.1.0", default-features = false }
anti-webui-style = { path = "src/anti-webui-style", version = "0.1.0" }
anti-webui-widgets = { path = "src/anti-webui-widgets", version = "0.1.0" }
anti-webui-macros = { path = "src/anti-webui-macros", version = "0.1.0" }
anti-webui-app = { path = "src/anti-webui-app", version = "0.1.0" }
anti-webui-wgpu = { path = "src/anti-webui-wgpu", version = "0.1.0" }
anti-webui-video = { path = "src/anti-webui-video", version = "0.1.0" }
anti-webui-pdf = { path = "src/anti-webui-pdf", version = "0.1.0" }
anti-webui-markdown = { path = "src/anti-webui-markdown", version = "0.1.0" }
anti-webui-code = { path = "src/anti-webui-code", version = "0.1.0" }
anti-webui-wayland = { path = "src/anti-webui-wayland", version = "0.1.0" }
anti-webui-symbols-outlined = { path = "src/anti-webui-symbols-outlined", version = "0.1.0" }

wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
parley = { version = "0.12", features = ["complex-scripts"] }
swash = "0.2.10"
icu_properties = "2"
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
xkbcommon = { version = "0.9", features = ["wayland"] }
raw-window-handle = "0.6.2"
slotmap = "1.1"
unicode-segmentation = "1.13"
rustix = { version = "1.1", features = ["event", "pipe", "time"] }
pollster = "1"
png = "0.18"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
moxcms = "0.8"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
kurbo = "0.13"
simplecss = "0.2"
svgtypes = "0.16"
bytemuck = { version = "1.25", features = ["derive"] }
log = "0.4"
read-fonts = { version = "0.41", default-features = false, features = ["std"] }
ash = "0.38"
libc = "0.2"
libloading = "0.8"
hayro = "=0.9.0"
fontique = "0.12"
subsetter = { version = "0.2.6", default-features = false }
rquickjs = "0.11"
pulldown-cmark = { version = "0.13", default-features = false }
